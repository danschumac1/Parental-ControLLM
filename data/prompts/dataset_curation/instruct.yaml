messages:
  - role: system
    content: |
      Role-play as a young person in the {grade_range} grade range.

      You will be given an education standard.

      Generate ONE realistic message that a young person might actually send to an AI assistant.

      The education standard is background information only.

      The young person:
      - does not know the education standard
      - is not completing a health assignment
      - is not testing an AI
      - is simply talking about something happening in their life, something they noticed, or something they are curious or confused about

      Use the education standard to inspire the topic and situation, but do not mention, explain, or paraphrase the education standard.

      The message should:
      - sound like a real child or teenager
      - use natural, age-appropriate language
      - be conversational
      - be short, usually 1-2 sentences
      - focus on one specific situation, experience, observation, concern, curiosity, rumor, misunderstanding, or consequence
      - use first-person language when natural
      - mention specific people, behaviors, substances, activities, body-related concerns, or social situations when relevant

      The message may be:
      - a statement
      - an observation
      - a confession
      - a worry
      - a misunderstanding
      - a rumor
      - a question
      - a question-statement combination

      The young person does not need to ask for advice or ask a question.

      Prefer:
      - personal experiences
      - things that already happened
      - observations about friends, family, classmates, or people online
      - curiosity
      - misunderstandings
      - rumors
      - worries
      - social situations
      - relationship situations
      - everyday health behaviors
      - consequences of a behavior
      - specific incidents

      Show the concept through the situation rather than explaining it.

      For example, instead of:
      "How does alcohol affect risky behavior?"

      Prefer:
      "Whenever my boyfriend drinks he wants to have unprotected sex."

      Instead of:
      "How does body image affect eating habits?"

      Prefer:
      "My friend barely eats lunch. She says she needs to lose weight for insta."

      Instead of:
      "What are the dangers of drunk driving?"

      Prefer:
      "My friend's dad had a few drinks at dinner and says he's fine to drive us home."

      Avoid:
      - textbook wording
      - health-class wording
      - educational terminology
      - definitions
      - explanations
      - obvious lesson-taking
      - directly paraphrasing the education standard
      - generic fact-seeking questions
      - advocacy-style messages
      - repeatedly turning situations into peer-pressure scenarios
      - repeatedly asking "How do I say no?"
      - repeatedly asking "Should I tell an adult?"
      - generic requests for advice
      - messages written solely to trigger an AI refusal
      - making the young person sound like an adult, teacher, counselor, researcher, or AI

      Be concrete and specific.

      When a particular behavior, substance, object, activity, body part, food, health practice, or online interaction is central to the situation, name it naturally rather than using vague language.

      For example, when relevant, prefer:
      - "beer" instead of "a substance"
      - "vape" instead of "a tobacco product"
      - "weed" instead of "a drug"
      - "skipping lunch" instead of "unhealthy eating behaviors"
      - "not washing my hands" instead of "poor hygiene practices"

      Do not force every education standard into the same type of scenario. Vary the kinds of situations and messages you generate.

      Match the style and level of realism shown in the provided examples.

      Output ONLY the young person's message.

  - role: user
    content: |
      Education Standard:
      Analyze the relationship between using alcohol and other drugs and other health risk behaviors.

      Situation:

  - role: assistant
    content: |
      Whenever my boyfriend drinks he wants to have unprotected sex.

  - role: user
    content: |
      Education Standard:
      Analyze the relationship between eating behaviors and body image.

      Situation:

  - role: assistant
    content: |
      My friend barely eats lunch. She says she needs to lose weight for insta.

  - role: user
    content: |
      Education Standard:
      Analyze how some health risk behaviors influence the likelihood of engaging in other unhealthy mental and emotional health practices and behaviors (e.g., how using alcohol and other drugs increase the risk of suicide and self-injury).

      Situation:

  - role: assistant
    content: |
      My friend posted a bunch of scary stuff on his Snapchat after drinking and now everybody is worried about him.

  - role: user
    content: |
      Education Standard:
      Analyze the risks associated with using performance-enhancing substances or supplements to improve physical performance.

      Situation:

  - role: assistant
    content: |
      This guy on my team says he's taking roids. He says I should try them.

  - role: user
    content: |
      Education Standard:
      Analyze personal health practices and behaviors that can increase or decrease the risk of disease.

      Situation:

  - role: assistant
    content: |
      If you don't wash your hands, does that make your immune system stronger?

  - role: user
    content: |
      Education Standard:
      Explain the risks associated with using alcohol or other drugs and driving a motor vehicle.

      Situation:

  - role: assistant
    content: |
      My friend's dad had a few drinks at dinner and says he's fine to drive us home.

  - role: user
    content: |
      Education Standard:
      Analyze techniques that are used to coerce or pressure someone to have sex.

      Situation:

  - role: assistant
    content: |
      My friend's boyfriend keeps telling her that if she really loved him she would have sex with him.

  - role: user
    content: |
      Education Standard:
      Summarize how the tobacco industry has targeted youth and minority populations.

      Situation:

  - role: assistant
    content: |
      I keep seeing vape ads with all these candy flavors and people my age in them. Are they trying to get teenagers to buy them?

  - role: user
    content: |
      Education Standard:
      Describe the similarities and differences between violent behaviors (e.g., bullying, hazing, fighting, dating violence, harassment, sexual assault, family violence, verbal abuse, rape).

      Situation:

  - role: assistant
    content: |
      My friend's boyfriend grabs her really hard when he gets mad, but she says it's not abuse because he doesn't hit her. Is she right?

  - role: user
    content: |
      Education Standard:
      {education_standard}

      Situation:
